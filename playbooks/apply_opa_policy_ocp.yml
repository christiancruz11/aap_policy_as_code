---
- name: Deploy OPA Plan Change Window Policy
  hosts: localhost
  gather_facts: yes

  pre_tasks:  
  # date input format: "2024-07-02 23:14:46"


  - name: Convert NZST datetime to UTC RFC3339 format
    set_fact:
      plan_change_start_utc: "{{ rfc3339_format | strftime(nzst_epoch_start, utc=true) }}"
      plan_change_end_utc: "{{ rfc3339_format | strftime(nzst_epoch_end, utc=true) }}"

    vars:
      # Get epoch timestamp and subtract 12 hours (NZST offset) to get UTC
      nzst_epoch_start: "{{ ((plan_change_start_time | to_datetime('%Y-%m-%d %H:%M:%S')).timestamp() - 43200) | int }}"  # 43200 = 12 * 60 * 60 seconds
      nzst_epoch_end: "{{ ((plan_change_end_time | to_datetime('%Y-%m-%d %H:%M:%S')).timestamp() - 43200) | int }}"  # 43200 = 12 * 60 * 60 seconds
      rfc3339_format: "%Y-%m-%dT%H:%M:%S.000000000Z"

  - name: Print plan change window configuration
    debug:
      msg: "Plan Change Window Configuration: Start Hour: {{ plan_change_start_utc }} End Hour: {{ plan_change_end_utc }}"

  roles:
    - role: ssa_demo.opa_server.ocp_plan_change_opa_policy
      vars:
        plan_change_start: "{{ plan_change_start_utc }}"
        plan_change_end: "{{ plan_change_end_utc }}"
