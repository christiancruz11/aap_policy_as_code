---
- name: Deploy rendered Rego policy to OpenShift OPA REST API
  ansible.builtin.uri:
    url: "http://{{ opa_route_host }}{{ opa_policy_api_path }}/{{ opa_policy_id }}"
    method: PUT
    headers: "{{ opa_http_headers }}"
    body: "{{ lookup('template', 'plan_change_window.rego.j2') }}"
    status_code: "{{ opa_expected_http_status }}"
  delegate_to: localhost
  register: policy_upload
  notify:
    - Verify OPA cluster health
    - Audit loaded OPA policies

- name: Display policy deployment status
  ansible.builtin.debug:
    msg: "Policy '{{ opa_policy_id }}' successfully updated on OPA server ({{ opa_route_host }})."
  when: policy_upload.changed

- name: Fetch details for the deployed policy
  ansible.builtin.uri:
    url: "http://{{ opa_route_host }}{{ opa_policy_api_path }}/{{ opa_policy_id }}"
    method: GET
    status_code: 200
  delegate_to: localhost
  register: policy_details

- name: Show active policy definition ID
  ansible.builtin.debug:
    msg: "Confirmed active policy ID: {{ policy_details.json.result.id }}"
  


