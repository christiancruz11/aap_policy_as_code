---
- name: Find all .rego policy files in {{ opa_policies_source_dir }}
  ansible.builtin.find:
    paths: "{{ opa_policies_source_dir }}"
    patterns: "*.rego"
  register: found_policy_files
  delegate_to: localhost

- name: Fail if no .rego files were found
  ansible.builtin.fail:
    msg: "No .rego files found in {{ opa_policies_source_dir }}"
  when: found_policy_files.matched == 0

- name: Upload .rego policy files to OPA REST API
  ansible.builtin.uri:
    url: "{{ opa_url }}/v1/policies/{{ item.path | basename | regex_replace('\\.rego$', '') }}"
    method: PUT
    body: "{{ lookup('ansible.builtin.template', item.path) }}"
    body_format: raw
    headers:
      Content-Type: "text/plain"
    status_code:
      - 200
      - 202
  loop: "{{ found_policy_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: opa_upload_results
  delegate_to: localhost

- name: Display policy deployment results
  ansible.builtin.debug:
    msg: "Policy '{{ item.item.path | basename }}' uploaded as ID '{{ item.url | basename }}' (HTTP {{ item.status }})"
  loop: "{{ opa_upload_results.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"
  